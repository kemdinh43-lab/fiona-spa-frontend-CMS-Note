<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fiona Massage & Spa in Da Nang offers massage, facials, nails, shampoo, eyelash and waxing services. Book your relaxing spa appointment online."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#8f4f3f" />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <style>
      [data-app-loading-shell] {
        display: none;
      }

      html.js [data-app-loading-shell] {
        display: block;
        min-height: 100vh;
        background: #fff9f5;
        color: transparent;
        overflow: hidden;
      }

      html.js [data-seo-snapshot] {
        display: none !important;
      }

      .app-loading-header,
      .app-loading-hero {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .app-loading-header {
        min-height: 80px;
        display: flex;
        align-items: center;
        gap: 36px;
      }

      .app-loading-nav {
        display: flex;
        flex: 1;
        justify-content: center;
        gap: 24px;
      }

      .app-loading-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr);
        gap: 56px;
        padding-top: 42px;
      }

      .app-loading-copy {
        padding-top: 6px;
      }

      .app-loading-actions {
        display: flex;
        gap: 14px;
        margin-top: 34px;
      }

      .app-loading-block {
        border-radius: 999px;
        background: linear-gradient(100deg, #f4dfd3 25%, #fceee6 45%, #f4dfd3 65%);
        background-size: 220% 100%;
        animation: app-loading-shimmer 1.4s ease-in-out infinite;
      }

      .app-loading-logo {
        width: 136px;
        height: 42px;
      }

      .app-loading-nav .app-loading-block {
        width: 64px;
        height: 14px;
      }

      .app-loading-book {
        width: 132px;
        height: 44px;
      }

      .app-loading-eyebrow {
        width: 300px;
        max-width: 70%;
        height: 34px;
      }

      .app-loading-title {
        width: 86%;
        height: 108px;
        border-radius: 18px;
        margin-top: 28px;
      }

      .app-loading-line {
        width: 100%;
        height: 16px;
        margin-top: 16px;
      }

      .app-loading-line-short {
        width: 72%;
      }

      .app-loading-action {
        width: 164px;
        height: 58px;
      }

      .app-loading-image {
        min-height: 560px;
        border-radius: 10px;
      }

      @keyframes app-loading-shimmer {
        from { background-position: 100% 0; }
        to { background-position: -100% 0; }
      }

      @media (max-width: 820px) {
        .app-loading-header {
          min-height: 68px;
          justify-content: space-between;
        }

        .app-loading-nav {
          display: none;
        }

        .app-loading-hero {
          grid-template-columns: 1fr;
          gap: 30px;
          padding-top: 26px;
          padding-bottom: 32px;
        }

        .app-loading-title {
          height: 82px;
        }

        .app-loading-image {
          min-height: 360px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading-block {
          animation: none;
        }
      }
    </style>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fiona Massage & Spa" />
    <meta property="og:title" content="Fiona Massage & Spa | Massage & Beauty in Da Nang" />
    <meta
      property="og:description"
      content="Relax at Fiona Massage & Spa in Da Nang. Explore massage and beauty services, view prices and book your visit."
    />
    <meta property="og:image" content="https://fionaspadanang.com/og-image.png" />
    <meta property="og:image:alt" content="Fiona Massage & Spa in Da Nang" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fiona Massage & Spa | Massage & Beauty in Da Nang" />
    <meta
      name="twitter:description"
      content="Relax at Fiona Massage & Spa in Da Nang. Explore massage and beauty services, view prices and book your visit."
    />
    <meta name="twitter:image" content="https://fionaspadanang.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>Fiona Massage & Spa | Massage, Facials and Nails in Da Nang</title>
  </head>
  <body>
    <div id="root">
      <div data-app-loading-shell role="status" aria-label="Loading Fiona Massage &amp; Spa">
        <header class="app-loading-header">
          <div class="app-loading-block app-loading-logo"></div>
          <div class="app-loading-nav" aria-hidden="true">
            <div class="app-loading-block"></div>
            <div class="app-loading-block"></div>
            <div class="app-loading-block"></div>
            <div class="app-loading-block"></div>
            <div class="app-loading-block"></div>
            <div class="app-loading-block"></div>
          </div>
          <div class="app-loading-block app-loading-book"></div>
        </header>
        <main class="app-loading-hero">
          <div class="app-loading-copy" aria-hidden="true">
            <div class="app-loading-block app-loading-eyebrow"></div>
            <div class="app-loading-block app-loading-title"></div>
            <div class="app-loading-block app-loading-line"></div>
            <div class="app-loading-block app-loading-line"></div>
            <div class="app-loading-block app-loading-line app-loading-line-short"></div>
            <div class="app-loading-actions">
              <div class="app-loading-block app-loading-action"></div>
              <div class="app-loading-block app-loading-action"></div>
            </div>
          </div>
          <div class="app-loading-block app-loading-image" aria-hidden="true"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
